<style>
body {
margin: 0;
padding: 0;
height: 100dvh;
overflow: hidden;
background-color: #000;
}
.overlay-panel {
position: absolute;
inset: 0;
z-index: 50;
display: flex;
align-items: center;
justify-content: center;

}
.touch-controls-movement {

margin-left: calc(50vw - 68px);

bottom: 1dvw;
opacity: .5;
pointer-events: none;
filter: drop-shadow(0px 0px 5px #ffbbcc);
}
